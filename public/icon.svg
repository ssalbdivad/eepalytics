<!--
  coachskaffur — the app mark.

  An original, deliberately abstract fawn-with-glasses: the app coaches a Lillia one-trick, and
  the glasses are the whole joke (the sleepy fawn as a professor). Drawn from primitives rather
  than traced from any Riot asset — this is a local tool's icon, not a redistribution of game art.

  Built to survive being 16px in a taskbar: three shapes read at that size (silhouette, glasses,
  antlers) and everything else is detail that politely disappears.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="coachskaffur">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b2b"/>
      <stop offset="1" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a2d0"/>
      <stop offset="1" stop-color="#c169a8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9d8"/>
      <stop offset="1" stop-color="#e8c8a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e6d2"/>
      <stop offset="1" stop-color="#c8aa6e"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="53" fill="none" stroke="#232a39" stroke-width="2"/>

  <!-- Figure nudged down and out: the first render sat high with dead space under the muzzle,
       which wastes exactly the pixels that matter at 16px. -->
  <g transform="translate(0 16) scale(1.045) translate(-6 -6)">
  <!-- antlers: the silhouette cue that says "fawn" before any detail is legible -->
  <g stroke="url(#gold)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M84 74 C72 52 62 44 48 40"/>
    <path d="M66 56 C56 50 48 50 40 54"/>
    <path d="M172 74 C184 52 194 44 208 40"/>
    <path d="M190 56 C200 50 208 50 216 54"/>
  </g>
  <!-- a leaf on one antler: Lillia's whole kit is dream-pollen and foliage -->
  <path d="M208 40 c14 -10 26 -6 30 2 c-6 12 -20 16 -30 8 z" fill="#7fd6a8" opacity="0.9"/>

  <!-- ears -->
  <ellipse cx="56" cy="128" rx="19" ry="30" fill="url(#face)" transform="rotate(-18 56 128)"/>
  <ellipse cx="200" cy="128" rx="19" ry="30" fill="url(#face)" transform="rotate(18 200 128)"/>

  <!-- face -->
  <path d="M128 62 c44 0 74 30 74 72 c0 44 -32 74 -74 74 c-42 0 -74 -30 -74 -74 c0 -42 30 -72 74 -72 z" fill="url(#face)"/>

  <!-- hair sweep, kept to the top so it never crowds the glasses -->
  <path d="M54 128 c0 -44 32 -70 74 -70 c42 0 74 26 74 70 c-10 -26 -34 -40 -74 -40 c-40 0 -64 14 -74 40 z" fill="url(#hair)"/>
  <path d="M128 58 c-26 0 -48 10 -62 28 c18 -10 38 -14 62 -14 c24 0 44 4 62 14 c-14 -18 -36 -28 -62 -28 z" fill="#ffd0ea" opacity="0.55"/>

  <!-- the glasses: the joke, and the second thing that has to read at 16px -->
  <g fill="none" stroke="#2b3345" stroke-width="8">
    <circle cx="96" cy="146" r="27" fill="#cfe6f5" fill-opacity="0.32"/>
    <circle cx="160" cy="146" r="27" fill="#cfe6f5" fill-opacity="0.32"/>
    <path d="M123 146 h10" stroke-linecap="round"/>
    <path d="M69 140 l-14 -7" stroke-linecap="round"/>
    <path d="M187 140 l14 -7" stroke-linecap="round"/>
  </g>
  <!-- lens glint, so the glasses read as glass rather than as goggles -->
  <path d="M84 134 a16 16 0 0 1 14 -8" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M148 134 a16 16 0 0 1 14 -8" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- half-lidded eyes: she is a sleep champion; wide eyes would read as the wrong character -->
  <path d="M86 150 a10 9 0 0 1 20 0 z" fill="#3a2a3a"/>
  <path d="M150 150 a10 9 0 0 1 20 0 z" fill="#3a2a3a"/>

  <!-- muzzle -->
  <path d="M128 168 c-4 0 -7 3 -7 6 c0 4 3 6 7 6 c4 0 7 -2 7 -6 c0 -3 -3 -6 -7 -6 z" fill="#c78fa8"/>
  <path d="M128 180 v6 M128 186 c-6 0 -10 -3 -12 -6 M128 186 c6 0 10 -3 12 -6" stroke="#c78fa8" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
