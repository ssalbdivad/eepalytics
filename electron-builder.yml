# Packaging eepalytics as a Windows app.
#
# WHAT THIS PRODUCES
#   release/eepalytics-0.1.0-setup.exe   — a per-user NSIS installer
#   release/win-unpacked/                — the same app as a folder, for poking at
#
# HOW TO PRODUCE IT
#   pnpm build && pnpm dist:win
#
# ON WINDOWS, from a checkout with `pnpm install` already run. It has never been built: this
# machine is Linux and the config below is written from the file layout, not from a build log.
# Cross-building the NSIS target from Linux is possible with Wine, but it is not the path this
# app ships on and it is not the one to debug first.
#
# WHY electron-builder AND NOT SOMETHING SMALLER
# The app needs three things a plain zip does not give: an installer that puts a Start-menu entry
# somewhere Windows will find it, an `.exe` carrying the app icon rather than Electron's, and an
# uninstaller that leaves the database alone. Forge would do the same job through more plugins;
# `electron-packager` alone does the folder and stops before the installer.

appId: com.eepalytics.app
productName: eepalytics
copyright: David Blass

directories:
  output: release

# THE APP IS SHIPPED AS SOURCE, ON PURPOSE, AND THAT IS WHY THERE IS NO ARCHIVE.
#
# Electron 44 bundles Node 24.19.0, which strips TypeScript types with no flag and no build step
# (measured), so the daemon runs the same `.ts` files the repo holds — there is nothing to
# compile and nothing to keep in sync with a build output. Two things then argue against `asar`:
# `knowledge/` is documented as editable markdown the user changes without a code change, and an
# archive would bury it; and the daemon is forked as a real file path by
# `electron/daemon.mjs`, which is one fewer thing to be clever about when it is a real file.
# What asar buys back is a faster cold start from fewer file opens, on a tool that starts once a
# session and then waits for a game to end.
asar: false

# Nothing here has a native addon — `node:sqlite` is built into Node, which is the reason it was
# chosen. Rebuilding is a several-minute step that can only fail.
npmRebuild: false

# Everything the daemon reads at runtime, and nothing else. The default set would sweep in the
# whole checkout, including `data/` — this user's database, replays and screenshots.
files:
  - electron/**/*
  # The built SPA. `src/server/app.ts` serves it from `<app root>/dist`, so it must sit beside
  # `src/` exactly as it does in the checkout. `pnpm build` first, or the window loads a 503
  # that says so.
  - dist/**/*
  # Executed, not compiled. This IS the daemon.
  - src/**/*
  - '!src/**/*.test.ts'
  # Champion notes, meant to be edited in place after installation.
  - knowledge/**/*
  # The window and taskbar icon, read off disk at launch by `electron/main.mjs`, and the splash
  # it shows while the daemon boots. The rest of `public/` is already inside `dist/`.
  - public/icon.png
  - public/icon.ico
  - public/splash-512.png
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  # Generated by `pnpm icon` from the same art as everything else, with 16/32/48/64/128/256
  # entries so Windows has the size it wants for the taskbar, Alt-Tab and Explorer. It is a real
  # `.ico` rather than a PNG for electron-builder to convert, because that conversion is the one
  # step of this build that cannot be checked from here.
  icon: public/icon.ico

nsis:
  # One click, no wizard, no elevation: it installs under the user's own AppData, which is where
  # a tool that only ever touches this user's League client belongs. A UAC prompt on a personal
  # coaching app is a question with only one sensible answer, so it is not asked.
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: eepalytics
  # THE IMPORTANT ONE. `userData` holds `csk.db`, and the match-history API hands back a
  # server-chosen ~20-game window with `begIndex`/`endIndex` silently ignored — which is why this
  # app harvests incrementally and keeps games forever. Every game older than that window exists
  # in exactly one place, and an uninstall must not be what deletes it.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
# NOTE FOR THE FIRST REAL BUILD: this repo installs with pnpm, whose `node_modules` is a tree of
# symlinks into `.pnpm/`. If dependency collection comes out empty or short, the known fix is
# `node-linker=hoisted` in `.npmrc` followed by a fresh `pnpm install` — not a change to the list
# above.
