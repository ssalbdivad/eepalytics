# Optional pre-warm for knowledge/champions/*.md.
#
# THE APP DOES NOT NEED THIS. `src/knowledge/research.ts` refreshes a champion's notes locally,
# on demand, the first time that champion is reviewed on a patch it has no notes for — keyed by
# (champion, patch), so it cannot go stale and it only ever researches champions actually played.
# That runs on the user's machine against their already-authenticated `claude` CLI, with no API
# key and no CI.
#
# What this workflow adds is only WARMTH: it does the research before the first review of a new
# patch, so that review is not the one that pays for it. If that is not worth a secret to you,
# delete this file — nothing depends on it.
#
# IT OPENS A PR, IT NEVER PUSHES TO MAIN. `knowledge/` is the only part of the coaching prompt
# not measured from a real game; everywhere else an unsupported figure is rejected by
# src/review/parse.ts, and here only a person reading the diff can catch a bad claim.
#
# SETUP: one repo secret, ANTHROPIC_API_KEY. Without it the job opens an issue instead and never
# fails the build.

name: Refresh champion context

on:
  schedule:
    # Riot ships Wednesdays; Thursday 09:00 UTC gives the data sites a day of games on the new
    # patch, so a route's sample size means something by the time it is quoted.
    - cron: "0 9 * * 4"
  workflow_dispatch:
    inputs:
      champions:
        description: "Comma-separated champion keys to refresh (default: whatever is stale)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-champion-context
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.patch.outputs.stale }}
      live: ${{ steps.patch.outputs.live }}
      champions: ${{ steps.patch.outputs.champions }}
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"

      # `secrets` is not usable in a job-level `if`, so surface it as an output instead.
      - id: key
        run: echo "has_key=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - id: patch
        name: Compare knowledge/ against the live patch
        env:
          REQUESTED: ${{ inputs.champions }}
        run: |
          set -euo pipefail
          out=$(node --experimental-strip-types --no-warnings=ExperimentalWarning \
                  scripts/check-patch.ts --json)
          echo "$out"
          node -e '
            const j = JSON.parse(process.argv[1])
            const requested = (process.env.REQUESTED ?? "").split(",").map(s => s.trim()).filter(Boolean)
            const champs = requested.length > 0 ? requested : j.notes.filter(n => n.stale).map(n => n.champion)
            const lines = [
              `live=${j.live ?? ""}`,
              `stale=${champs.length > 0}`,
              `champions=${champs.join(",")}`
            ]
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n")
          ' "$out"

  refresh:
    needs: check
    if: needs.check.outputs.stale == 'true' && needs.check.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "WebSearch,WebFetch,Read,Write,Edit,Bash(node:*),Bash(git:*)"
          branch: "auto/champion-context-${{ needs.check.outputs.live }}"
          prompt: |
            Patch ${{ needs.check.outputs.live }} is live. Refresh the champion notes for:
            ${{ needs.check.outputs.champions }}

            The rules you must follow are already written down in this repo, and they are the
            same ones the app applies when it does this locally. Read them first, in order:

              1. `knowledge/SOURCES.md`  — which domains are sanctioned and what may be written
                 down at all. Do not use a source outside that list.
              2. `knowledge/README.md`   — the fence these files live behind.
              3. `src/knowledge/research.ts` — the constant `TRUSTED_DOMAINS` and the prompt in
                 `RULES()` are the authoritative version of this task. Follow that prompt.
              4. The existing file for each champion, so you keep what is still true instead of
                 regenerating it.

            The two rules worth repeating because they are the ones that matter:
              - No item builds, rune pages, or skill order as a grading criterion. The app's data
                has none of those, so advice about them could never be checked against what the
                player did.
              - If you cannot verify something from a sanctioned source, LEAVE IT OUT and say so
                in the PR body. An incomplete note is fine. An invented one is not.

            Every file needs `patch:`, `sourcedAt:` and `source:` headers — a note with no
            `source:` line is discarded unread by `sourcesAreTrusted()`, so check yours parses:

              node --experimental-strip-types --no-warnings=ExperimentalWarning scripts/check-patch.ts
              node --experimental-strip-types --no-warnings=ExperimentalWarning --test "src/knowledge/**/*.test.ts"

            Open a PR against main. For each champion list what changed, the source and patch
            behind each claim, and anything you left out because you could not verify it.
            Do not merge it.

  notify:
    needs: check
    if: needs.check.outputs.stale == 'true' && needs.check.outputs.has_key != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          LIVE: ${{ needs.check.outputs.live }}
          CHAMPS: ${{ needs.check.outputs.champions }}
        with:
          script: |
            const { LIVE, CHAMPS } = process.env
            const title = `Champion context is behind patch ${LIVE}`
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "champion-context"
            })
            if (open.data.some(i => i.title === title)) return
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["champion-context"],
              body: [
                `Patch **${LIVE}** is live and these notes were written for an older one:`,
                "",
                CHAMPS.split(",").filter(Boolean).map(c => `- \`knowledge/champions/${c}.md\``).join("\n"),
                "",
                "No `ANTHROPIC_API_KEY` secret is set, so this ran as a notification only.",
                "",
                "**You probably do not need to do anything.** The app refreshes these locally the",
                "first time it reviews a game on a new patch — see `src/knowledge/research.ts`.",
                "This workflow only pre-warms that so the first review is not the slow one.",
              ].join("\n")
            })
